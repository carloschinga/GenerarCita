
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=bartolito_lolcli;encrypt=false
spring.datasource.username=sa
spring.datasource.password=admin
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.application.name=GenerarCita
server.port=8082
spring.jpa.show-sql=true
server.servlet.context-path=/gcita

file.upload-dir=D:/upload
spring.web.resources.static-locations=file:${file.upload-dir}/,classpath:/static/

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
