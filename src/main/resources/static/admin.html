<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>Especialidades - Clínica San Bartolomé</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2A3B90;
            --accent: #FFC107;
            --bg: #F3F4F6;
            --font: 'Manrope', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background: #f3f4f6;
            color: #1f2937;
            padding-bottom: 60px;
            overflow-x: hidden;
        }

        /* HERO BANNER */
        .hero-section {
            position: relative;
            height: 380px;
            background: linear-gradient(135deg, rgba(42, 59, 144, 0.92) 0%, rgba(30, 40, 117, 0.96) 100%),
                url('https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            border-radius: 0 0 40px 40px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
        }

        .top-bar {
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            padding: 0 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
        }

        .brand-logo {
            background: white;
            padding: 10px 24px;
            border-radius: 16px;
            height: 64px;
            display: flex;
            align-items: center;
        }

        .brand-logo img {
            height: 100%;
            width: auto;
            object-fit: contain;
        }

        .hero-title {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 10px;
            margin-top: 20px;
        }

        .hero-subtitle {
            font-size: 18px;
            opacity: 0.9;
        }

        /* CONTAINER */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 30px;
            position: relative;
            z-index: 10;
        }

        /* FILTER CARD */
        .filter-card {
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            margin-top: -60px;
            margin-bottom: 50px;
        }

        .filter-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .filter-icon-box {
            width: 48px;
            height: 48px;
            background: #FFF4DA;
            color: #F59E0B;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .input-wrapper label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #6b7280;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .custom-input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 2px solid #e5e7eb;
            font-size: 15px;
            outline: none;
            background: #f9fafb;
            font-family: var(--font);
        }

        /* GRID DE MÉDICOS */
        .grid-medicos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .medico-card {
            position: relative;
            height: 420px;
            border-radius: 24px;
            overflow: hidden;
            background-color: #e2e8f0;
            background-size: cover;
            background-position: center top;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            image-rendering: -webkit-optimize-contrast;
        }

        .medico-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 50px rgba(42, 59, 144, 0.25);
        }

        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(to top, rgba(10, 15, 40, 0.95) 10%, rgba(10, 15, 40, 0.6) 50%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 24px;
            color: white;
        }

        .card-name {
            font-size: 20px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 6px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .card-spec {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .card-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            outline: none;
            width: 100%;
        }

        .medico-card:hover .card-btn {
            background: var(--accent);
            color: #111;
            border-color: var(--accent);
        }

        .btn-upload {
            margin-top: 8px;
            background: rgba(42, 59, 144, 0.8) !important;
        }

        .btn-upload:hover {
            background: var(--primary) !important;
        }

        /* MODAL UPLOAD */
        .modal-upload {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
        }

        .modal-upload.open {
            display: flex;
            animation: fadeIn 0.3s ease-out;
        }

        .upload-panel {
            background: white;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            /* Cambios importantes: */
            overflow: hidden; /* Evita que todo se desborde */
        }

        .upload-header {
            padding: 20px 25px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0; /* Evita que el header se encoja */
        }

        .upload-header h3 {
            font-weight: 800;
            font-size: 20px;
            color: #1f2937;
        }

        .upload-body {
            padding: 25px;
            text-align: center;
            /* Cambios importantes: */
            flex: 1; /* Ocupa el espacio disponible */
            overflow-y: auto; /* Permite scroll solo si es necesario */
            max-height: calc(90vh - 80px); /* Considera el alto del header */
        }

        .upload-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-shrink: 0; /* Evita que los botones se encojan */
        }

        .image-preview-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }

        .current-image {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .upload-preview {
            width: 200px;
            height: 200px;
            margin: 0 auto 15px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9fafb;
        }

        .upload-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .no-image {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #9ca3af;
        }

        .no-image i {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .upload-info {
            text-align: center;
            margin-bottom: 25px;
            padding: 15px;
            background: #f9fafb;
            border-radius: 12px;
        }

        .upload-info h4 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
            color: #1f2937;
        }

        .upload-info p {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 5px;
        }

        .medico-id {
            font-size: 12px;
            color: #9ca3af;
            background: white;
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 5px;
        }

        .file-input-wrapper {
            margin: 20px 0;
            text-align: left;
        }

        .file-input-wrapper label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 8px;
        }

        .file-input-wrapper input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            background: #f9fafb;
            cursor: pointer;
            font-family: var(--font);
        }

        .upload-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel {
            flex: 1;
            background: #f3f4f6;
            color: #4b5563;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-family: var(--font);
            font-size: 15px;
        }

        .btn-cancel:hover {
            background: #e5e7eb;
        }

        .btn-submit {
            flex: 1;
            background: #2A3B90;
            color: white;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-family: var(--font);
            font-size: 15px;
        }

        .btn-submit:hover {
            background: #233072;
        }

        .btn-submit:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        /* RESPONSIVE */
        @media (max-width: 800px) {
            /* ... tus estilos existentes ... */

            .upload-panel {
                max-width: 90vw; /* Más flexible en móviles */
            }

            .upload-body {
                padding: 20px 15px; /* Menos padding en móviles */
            }

            .upload-actions {
                flex-direction: column; /* Botones en columna en móviles muy pequeños */
            }

            .btn-cancel,
            .btn-submit {
                width: 100%; /* Botones de ancho completo */
            }
        }

        @media (max-width: 480px) {
            .upload-panel {
                max-width: 95vw;
                border-radius: 16px; /* Bordes más pequeños en móviles */
            }

            .upload-header {
                padding: 15px 20px;
            }

            .upload-header h3 {
                font-size: 18px;
            }

            .upload-body {
                padding: 15px 12px;
            }

            .upload-preview {
                width: 140px;
                height: 140px;
            }

            .upload-info h4 {
                font-size: 16px;
            }
        }

        /* LOGIN MODAL */
        .login-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5000;
        }

        .login-box {
            width: 90%;
            max-width: 380px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 800;
            color: #2A3B90;
        }

        .input-login {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 2px solid #d1d5db;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 12px;
            border: none;
            background: #2A3B90;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-login:hover {
            background: #233072;
        }

        .login-msg {
            margin-top: 10px;
            font-size: 14px;
            color: red;
        }
    </style>
</head>

<body>

    <header class="hero-section">
        <div class="top-bar">
            <div class="brand-logo"><img src="img/logo2.png" alt="Logo"></div>
        </div>
        <div class="hero-content">
            <h1 class="hero-title">Staff Médico Especializado</h1>
            <p class="hero-subtitle">Gestión de fotos del personal médico</p>
        </div>
    </header>

    <div class="main-container">
        <div class="filter-card">
            <div class="filter-header">
                <div class="filter-icon-box"><i class="fa-solid fa-filter"></i></div>
                <h2>Filtrar Especialidad</h2>
            </div>
            <div class="controls-grid">
                <div class="input-wrapper">
                    <label>Búsqueda Rápida</label>
                    <input id="txtEspecialidad" class="custom-input" placeholder="Ej: CARDIOLOGIA...">
                </div>
                <div class="input-wrapper">
                    <label>Lista de Especialidades</label>
                    <select id="selectEspecialidad" class="custom-input">
                        <option value="">-- Seleccionar --</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="medicosSection" style="display:none;">
            <div style="margin-bottom:20px; display:flex; gap:10px; align-items:center;">
                <h3 style="font-size:24px; font-weight:800; color:#1f2937;">Médicos Disponibles</h3>
                <span id="badgeCount"
                    style="background:#2A3B90; color:white; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:700;">0</span>
            </div>
            <div id="gridMedicos" class="grid-medicos"></div>
        </div>
        <div id="emptyPlaceholder" style="text-align:center; padding:60px; color:#9ca3af;">
            <i class="fa-solid fa-user-doctor" style="font-size:48px; margin-bottom:16px;"></i>
            <p>Selecciona una especialidad para ver resultados.</p>
        </div>
    </div>

    <!-- Modal de Upload de Imagen -->
    <div id="modalUpload" class="modal-upload">
        <div class="upload-panel">
            <div class="upload-header">
                <h3>Actualizar Foto del Médico</h3>
                <button class="btn-close" onclick="cerrarUpload()">&times;</button>
            </div>
            <div class="upload-body">
                <div class="image-preview-container">
                    <div class="current-image">Imagen Actual</div>
                    <div class="upload-preview">
                        <div id="noImagePreview" class="no-image">
                            <i class="fa-solid fa-user-doctor"></i>
                            <span>Sin imagen</span>
                        </div>
                        <img id="previewImg" src="" alt="Vista previa" style="display: none;">
                    </div>
                </div>
                
                <div class="upload-info">
                    <h4 id="uploadNombre"></h4>
                    <p id="uploadEspecialidad"></p>
                    <span class="medico-id">ID: <span id="uploadCodigo"></span></span>
                </div>
                
                <div class="file-input-wrapper">
                    <label for="fileImg">Seleccionar nueva imagen</label>
                    <input type="file" id="fileImg" accept="image/*">
                </div>
                
                <div class="upload-actions">
                    <button class="btn-cancel" onclick="cerrarUpload()">Cancelar</button>
                    <button class="btn-submit" onclick="guardarImagen()" id="btnSubmit">Subir Imagen</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Login -->
    <div id="loginModal" class="login-modal">
        <div class="login-box">
            <h2>Iniciar Sesión</h2>
            <label>Usuario</label>
            <input type="text" id="username" class="input-login" autocomplete="off">
            <label>Contraseña</label>
            <input type="password" id="password" class="input-login">
            <button id="btnLogin" class="btn-login">Ingresar</button>
            <p id="loginMessage" class="login-msg"></p>
        </div>
    </div>

    <script>

		// URLs de API - Ajusta según tu configuración
		/*const API_SERVICIOS = 'http://localhost:8082/gcita/servicio/listar';
		const API_MEDICOS = 'http://localhost:8082/gcita/medico/listar';
		const API_FOTOS = 'http://localhost:8082/gcita/api/doctor/getFoto';
		const API_UPLOAD = 'http://localhost:8082/gcita/api/doctor/upload'; // Tu endpoint actual
		const API_AUTH = 'http://localhost:8082/gcita/auth/login';
        */

    /*
        const API_SERVICIOS = 'http://181.224.248.20/gcita/servicio/listar';
		const API_MEDICOS = 'http://181.224.248.20/gcita/medico/listar';
		const API_FOTOS = 'http://181.224.248.20/gcita/api/doctor/getFoto';
		const API_UPLOAD = 'http://181.224.248.20/gcita/api/doctor/upload'; // Tu endpoint actual
		const API_AUTH = 'http://181.224.248.20/gcita/auth/login';
		*/

        const API_SERVICIOS = '/GenerarCita/servicio/listar';
        const API_MEDICOS = '/GenerarCita/medico/listar';
        const API_FOTOS = '/GenerarCita/api/doctor/getFoto';
        const API_AUTH = '/GenerarCita/auth/login';
        const API_UPLOAD = '/GenerarCita/api/doctor/upload';

		// Base URL para las fotos
		const FOTOS_BASE_URL = 'http://181.224.248.20/appfotos/';

		// Variables globales
		let servicios = [], medicos = [];
		let medicosFotos = {}; // Cache de fotos: {medcod: url}
		let currentMedico = null;

		// Elementos del DOM
		const selectEsp = document.getElementById('selectEspecialidad');
		const inputEsp = document.getElementById('txtEspecialidad');
		const gridMed = document.getElementById('gridMedicos');
		const medicosSection = document.getElementById('medicosSection');
		const emptyPlaceholder = document.getElementById('emptyPlaceholder');
		const badgeCount = document.getElementById('badgeCount');

		const modalUpload = document.getElementById('modalUpload');
		const uploadNombre = document.getElementById('uploadNombre');
		const uploadEspecialidad = document.getElementById('uploadEspecialidad');
		const uploadCodigo = document.getElementById('uploadCodigo');
		const previewImg = document.getElementById('previewImg');
		const noImagePreview = document.getElementById('noImagePreview');
		const fileInput = document.getElementById('fileImg');
		const btnSubmit = document.getElementById('btnSubmit');

		// Función para formatear el código del médico a 4 dígitos
		function formatMedCod(codigo) {
		    return String(codigo).padStart(4, '0');
		}

		// Función para cargar fotos de un médico
		async function cargarFotoMedico(medcod) {
		    try {
		        // Si ya tenemos la foto en cache, usarla
		        if (medicosFotos[medcod]) {
		            return medicosFotos[medcod];
		        }
		        
		        // Obtener las fotos del médico desde tu API
		        const response = await fetch(`${API_FOTOS}/${medcod}`);
		        if (!response.ok) {
		            if (response.status === 204) {
		                console.log(`No hay fotos para el médico ${medcod}`);
		            }
		            return null;
		        }
		        
		        const fotos = await response.json();
		        console.log('Fotos recibidas para', medcod, ':', fotos);
		        
		        if (fotos && fotos.length > 0) {
		            // Buscar la primera foto con URL válida
		            const foto = fotos[0];
		            let fotoUrl = null;
		            
		            if (foto.urlFoto) {
		                // Construir la URL completa
		                fotoUrl = FOTOS_BASE_URL + foto.urlFoto;
		                console.log('URL construida:', fotoUrl);
		            } else if (foto.url) {
		                // Si ya viene la URL completa
		                fotoUrl = foto.url;
		            }
		            
		            if (fotoUrl) {
		                // Verificar que la imagen existe
		                const imgExists = await verificarImagen(fotoUrl);
		                if (imgExists) {
		                    medicosFotos[medcod] = fotoUrl;
		                    return fotoUrl;
		                } else {
		                    console.warn(`La imagen no existe en la URL: ${fotoUrl}`);
		                }
		            }
		        }
		        return null;
		    } catch (error) {
		        console.error(`Error cargando foto para ${medcod}:`, error);
		        return null;
		    }
		}

		// Función para verificar si una imagen existe
		function verificarImagen(url) {
		    return new Promise((resolve) => {
		        const img = new Image();
		        img.onload = () => resolve(true);
		        img.onerror = () => resolve(false);
		        img.src = url;
		    });
		}

		// Inicialización
		document.addEventListener('DOMContentLoaded', init);

		async function init() {
		    try {
		        const [s, m] = await Promise.all([
		            fetch(API_SERVICIOS).then(r => r.json()),
		            fetch(API_MEDICOS).then(r => r.json())
		        ]);
		        servicios = s; 
		        medicos = m;
		        fillSelect(servicios);

		        const def = servicios.find(x => x.descripcion.toUpperCase().includes('MEDICINA GENERAL'));
		        if (def) {
		            selectEsp.value = def.codigo;
		            await showDoctors(def.codigo);
		        }

		        inputEsp.addEventListener('input', e => filterServices(e.target.value));
		        selectEsp.addEventListener('change', async (e) => {
		            await showDoctors(e.target.value);
		        });

		        // Event listener para vista previa de imagen seleccionada
		        fileInput.addEventListener('change', function(e) {
		            const file = e.target.files[0];
		            if (file) {
		                // Validar tipo de archivo
		                if (!file.type.match('image.*')) {
		                    alert('Por favor, selecciona un archivo de imagen válido (JPG, PNG, etc.)');
		                    fileInput.value = '';
		                    return;
		                }
		                
		                // Validar tamaño (máximo 5MB)
		                if (file.size > 10 * 1024 * 1024) {
		                    alert('La imagen es demasiado grande. Máximo 5MB.');
		                    fileInput.value = '';
		                    return;
		                }
		                
		                const reader = new FileReader();
		                reader.onload = function(e) {
		                    previewImg.src = e.target.result;
		                    previewImg.style.display = 'block';
		                    noImagePreview.style.display = 'none';
		                }
		                reader.readAsDataURL(file);
		            }
		        });
		    } catch (e) {
		        console.error('Error en init:', e);
		    }
		}

		function fillSelect(list) {
		    selectEsp.innerHTML = '<option value="">-- Seleccionar --</option>';
		    list.forEach(i => {
		        const o = document.createElement('option');
		        o.value = i.codigo;
		        o.textContent = i.descripcion;
		        selectEsp.appendChild(o);
		    });
		}

		function filterServices(txt) {
		    txt = txt.toUpperCase();
		    if (!txt) {
		        fillSelect(servicios);
		        return;
		    }
		    const f = servicios.filter(x => x.descripcion.toUpperCase().includes(txt));
		    fillSelect(f);
		    if (f.length === 1) {
		        selectEsp.value = f[0].codigo;
		        showDoctors(f[0].codigo);
		    }
		}

		// Función para mostrar médicos (MODIFICADA)
		async function showDoctors(cod) {
		    if (!cod) {
		        medicosSection.style.display = 'none';
		        emptyPlaceholder.style.display = 'block';
		        return;
		    }

		    const docs = medicos.filter(x => String(x.codigoServicio) === String(cod));
		    gridMed.innerHTML = '';
		    badgeCount.textContent = docs.length;

		    if (docs.length === 0) {
		        medicosSection.style.display = 'none';
		        emptyPlaceholder.style.display = 'block';
		        emptyPlaceholder.innerHTML = '<p>No hay médicos en esta especialidad.</p>';
		        return;
		    }

		    medicosSection.style.display = 'block';
		    emptyPlaceholder.style.display = 'none';

		    // Cargar fotos para todos los médicos
		    for (const d of docs) {
		        const div = document.createElement('div');
		        div.className = 'medico-card';
		        
		        // Formatear el código del médico para que tenga 4 dígitos
		        const medcod = formatMedCod(d.codigo);
		        
		        // Intentar cargar la foto
		        let fotoUrl = await cargarFotoMedico(medcod);
		        
		        // Si no hay foto, usar una por defecto
		        if (!fotoUrl) {
		            fotoUrl = 'https://images.unsplash.com/photo-1612349317150-e413f6a5b16d?q=90&w=800&auto=format&fit=crop';
		        }
		        
		        // Establecer la imagen de fondo
		        div.style.backgroundImage = `url('${fotoUrl}')`;
		        
		        // Agregar estilo para mejor visualización
		        div.style.backgroundSize = 'cover';
		        div.style.backgroundPosition = 'center top';
		        div.style.backgroundRepeat = 'no-repeat';

		        // Almacenar datos del médico como atributos personalizados
		        div.setAttribute('data-medcod', medcod);
		        div.setAttribute('data-nombre', esc(d.descripcion));
		        div.setAttribute('data-especialidad', d.codigoServicio);
		        
		        // Agregar evento de clic a toda la tarjeta
		        div.addEventListener('click', function(e) {
		            // Prevenir que se active cuando se hace clic en el botón
		            if (e.target.closest('.card-btn')) {
		                return;
		            }
		            
		            const medcod = this.getAttribute('data-medcod');
		            const nombre = this.getAttribute('data-nombre');
		            const especialidad = this.getAttribute('data-especialidad');
		            
		            abrirUploadModal(medcod, nombre, especialidad);
		        });

		        div.innerHTML = `
		            <div class="card-overlay">
		                <div class="card-name">${d.descripcion}</div>
		                <div class="card-spec">${getServiceName(d.codigoServicio)}</div>
		                <button class="card-btn" onclick="event.stopPropagation(); abrirUploadModal('${medcod}', '${esc(d.descripcion)}', ${d.codigoServicio})">
		                    <i class="fa-solid fa-camera"></i> Gestionar Foto
		                </button>
		            </div>
		        `;
		        gridMed.appendChild(div);
		    }
		}

		// Función para abrir modal de upload
		async function abrirUploadModal(medcod, nombre, codServ) {
		    currentMedico = {
		        medcod: medcod, // Ya viene formateado
		        nombre: unesc(nombre),
		        especialidad: getServiceName(codServ)
		    };

		    // Mostrar información en el modal
		    uploadNombre.textContent = currentMedico.nombre;
		    uploadEspecialidad.textContent = currentMedico.especialidad;
		    uploadCodigo.textContent = currentMedico.medcod;

		    // Obtener foto actual
		    try {
		        const fotoUrl = await cargarFotoMedico(currentMedico.medcod);
		        
		        if (fotoUrl) {
		            previewImg.src = fotoUrl;
		            previewImg.style.display = 'block';
		            noImagePreview.style.display = 'none';
		            document.querySelector('.current-image').textContent = 'Imagen Actual';
		        } else {
		            previewImg.style.display = 'none';
		            noImagePreview.style.display = 'flex';
		            document.querySelector('.current-image').textContent = 'Sin Imagen';
		        }
		    } catch (error) {
		        console.error('Error cargando foto para modal:', error);
		        previewImg.style.display = 'none';
		        noImagePreview.style.display = 'flex';
		        document.querySelector('.current-image').textContent = 'Sin Imagen';
		    }

		    // Limpiar input de archivo
		    fileInput.value = '';

		    // Mostrar modal
		    modalUpload.classList.add('open');
		    document.body.style.overflow = 'hidden';
		}

		// Función para subir la imagen
		async function guardarImagen() {
		    if (!currentMedico) {
		        alert('No hay médico seleccionado');
		        return;
		    }

		    const file = fileInput.files[0];
		    if (!file) {
		        alert('Por favor, selecciona una imagen primero');
		        return;
		    }

		    if (!file.type.match('image.*')) {
		        alert('Por favor, selecciona un archivo de imagen válido');
		        return;
		    }

		    // Validar tamaño (máximo 5MB)
		    if (file.size > 10 * 1024 * 1024) {
		        alert('La imagen es demasiado grande. Máximo 5MB.');
		        return;
		    }

		    // Deshabilitar botón mientras se sube
		    btnSubmit.disabled = true;
		    btnSubmit.textContent = 'Subiendo...';

		    // Crear FormData según lo que espera tu endpoint
		    const formData = new FormData();
		    formData.append('file', file); // Tu endpoint espera 'file' como parámetro
		    
		    // El doctorId va en el path, no en el formData

		    try {
		        // Usar tu endpoint de upload
		        const response = await fetch(`${API_UPLOAD}/${currentMedico.medcod}`, {
		            method: 'POST',
		            body: formData
		            // No agregues headers para FormData, el navegador lo hace automáticamente
		        });

		        const result = await response.json();

		        if (response.ok) {
		            alert('Imagen subida correctamente');
		            
		            // Limpiar cache de foto para este médico
		            delete medicosFotos[currentMedico.medcod];
		            
		            // Si el servidor devuelve una ruta de archivo
		            if (result.filePath) {
		                // Construir la URL completa
		                const fotoUrl = FOTOS_BASE_URL + result.filePath;
		                medicosFotos[currentMedico.medcod] = fotoUrl;
		            }
		            
		            // Cerrar modal
		            cerrarUpload();
		            
		            // Volver a mostrar los médicos para actualizar la imagen
		            const currentSpecialty = selectEsp.value;
		            if (currentSpecialty) {
		                await showDoctors(currentSpecialty);
		            }
		        } else {
		            alert('Error al subir la imagen: ' + (result.message || 'Error desconocido'));
		        }
		    } catch (error) {
		        console.error('Error:', error);
		        alert('Error en la conexión con el servidor');
		    } finally {
		        // Rehabilitar botón
		        btnSubmit.disabled = false;
		        btnSubmit.textContent = 'Subir Imagen';
		    }
		}

		// Función para cerrar modal
		function cerrarUpload() {
		    modalUpload.classList.remove('open');
		    document.body.style.overflow = '';
		    currentMedico = null;
		    btnSubmit.disabled = false;
		    btnSubmit.textContent = 'Subir Imagen';
		}

		// Funciones auxiliares
		function getServiceName(c) {
		    const s = servicios.find(x => String(x.codigo) === String(c));
		    return s ? s.descripcion : 'General';
		}

		function esc(s) {
		    return String(s).replace(/'/g, "\\'").replace(/"/g, '\\"');
		}

		function unesc(s) {
		    return s.replace(/\\'/g, "'").replace(/\\"/g, '"');
		}

		// Cerrar modal al hacer clic fuera
		modalUpload.addEventListener('click', e => {
		    if (e.target === modalUpload) cerrarUpload();
		});

		// Login
		let intentos = 0;
		window.onload = () => {
		    document.getElementById("loginModal").style.display = "flex";
		};

		document.getElementById("btnLogin").addEventListener("click", function() {
		    let user = document.getElementById("username").value.trim().toUpperCase();
		    let pass = document.getElementById("password").value.trim();
		    let msg = document.getElementById("loginMessage");

		    if (user === "" || pass === "") {
		        msg.textContent = "Completa los campos.";
		        return;
		    }

		    let payload = {
		        username: user,
		        password: pass
		    };

		    msg.textContent = "Verificando...";
		    msg.style.color = "#666";

		    fetch(API_AUTH, {
		        method: "POST",
		        headers: {"Content-Type": "application/json"},
		        body: JSON.stringify(payload)
		    })
		    .then(r => r.json())
		    .then(data => {
		        console.log("Respuesta del servidor:", data);

		        if (data && data.resultado === "OK") {
		            console.log("LOGIN OK", data);
		            document.getElementById("loginModal").style.display = "none";
		            msg.textContent = "";
		            intentos = 0;
		        } else {
		            intentos++;
		            msg.textContent = `Credenciales incorrectas. Intento ${intentos} de 3`;
		            msg.style.color = "red";

		            if (intentos >= 3) {
		                setTimeout(() => {
		                    window.location.href = "http://181.224.248.20/gcita/index.html";
		                }, 1000);
		            }
		        }
		    })
		    .catch(err => {
		        console.error("Error:", err);
		        msg.textContent = "Error en el servidor.";
		        msg.style.color = "red";
		    });
		});

		// Detectar ENTER en login
		document.addEventListener("keypress", function(e) {
		    if (e.target.id === "username" || e.target.id === "password") {
		        if (e.key === "Enter") {
		            document.getElementById("btnLogin").click();
		        }
		    }
		});
    </script>
