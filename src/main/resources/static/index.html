<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
    <title>Especialidades - Clínica San Bartolomé</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root{
          --primary: #2A3B90;
          --accent: #FFC107;
          --bg: #F3F4F6;
          --font: 'Manrope', sans-serif;
        }

        *{box-sizing:border-box; margin:0; padding:0;}

        body{
            font-family: var(--font);
            background: #f3f4f6;
            color: #1f2937;
            padding-bottom: 60px;
            overflow-x: hidden; /* Evita scroll horizontal fantasma */
        }

        /* HERO BANNER */
        .hero-section {
            position: relative; height: 380px;
            background: linear-gradient(135deg, rgba(42,59,144,0.92) 0%, rgba(30,40,117,0.96) 100%),
                        url('https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?q=80&w=2000&auto=format&fit=crop');
            background-size: cover; background-position: center;
            border-radius: 0 0 40px 40px; padding: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; color: white;
        }
        .top-bar {
            position: absolute; top: 30px; left: 0; right: 0; padding: 0 40px;
            display: flex; justify-content: center;
            align-items: center;
            width: 100%; max-width: 1280px; margin: 0 auto;
        }
        .brand-logo { background: white; padding: 10px 24px; border-radius: 16px; height: 64px; display: flex; align-items: center; }
        .brand-logo img { height: 100%; width: auto; object-fit: contain; }

        .hero-title { font-size: 42px; font-weight: 800; margin-bottom: 10px; margin-top: 20px;}
        .hero-subtitle { font-size: 18px; opacity: 0.9; }

        /* CONTAINER */
        .main-container { max-width: 1200px; margin: 0 auto; padding: 0 30px; position: relative; z-index: 10; }

        /* FILTER CARD */
        .filter-card {
            background: white; padding: 30px; border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08); margin-top: -60px; margin-bottom: 50px;
        }
        .filter-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
        .filter-icon-box {
            width: 48px; height: 48px; background: #FFF4DA; color: #F59E0B; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .input-wrapper label { display: block; font-size: 12px; font-weight: 700; color: #6b7280; margin-bottom: 8px; text-transform: uppercase; }
        .custom-input {
            width: 100%; padding: 14px 18px; border-radius: 12px; border: 2px solid #e5e7eb;
            font-size: 15px; outline: none; background: #f9fafb; font-family: var(--font);
        }

        /* GRID DE MÉDICOS */
        .grid-medicos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .medico-card {
            position: relative;
            height: 420px;
            border-radius: 24px;
            overflow: hidden;
            background-color: #e2e8f0;
            background-size: cover;
            background-position: center top;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            image-rendering: -webkit-optimize-contrast;
        }

        .medico-card:hover { transform: translateY(-10px); box-shadow: 0 25px 50px rgba(42, 59, 144, 0.25); }

        .card-overlay {
            position: absolute; bottom: 0; left: 0; right: 0; height: 60%;
            background: linear-gradient(to top, rgba(10,15,40, 0.95) 10%, rgba(10,15,40, 0.6) 50%, transparent 100%);
            display: flex; flex-direction: column; justify-content: flex-end; padding: 24px; color: white;
        }
        .card-name { font-size: 20px; font-weight: 800; line-height: 1.2; margin-bottom: 6px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .card-spec { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 16px; }
        .card-btn {
            background: rgba(255,255,255,0.2); backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.4);
            color: white; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 14px;
            display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s;
        }
        .medico-card:hover .card-btn { background: var(--accent); color: #111; border-color: var(--accent); }

        /* MODAL GENERAL (PC) - TAMAÑO ESTÁTICO */
        .modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
            display: none;
            /* Flexbox para centrar en PC y Móvil */
            align-items: center; justify-content: center;
            z-index: 2000;
            padding: 20px;
        }
        .modal.open { display: flex; animation: fadeIn 0.3s ease-out; }

        .modal-panel {
            background: white;
            width: 100%; max-width: 950px; 
            height: 580px; /* ALTURA FIJA */
            border-radius: 30px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            position: relative;
        }

        .modal-left {
            width: 400px; flex-shrink: 0; position: relative; padding: 0; display: flex; flex-direction: column; justify-content: flex-end;
            background-size: cover; background-position: center top;
        }
        .profile-overlay {
            width: 100%; background: linear-gradient(to bottom, transparent 0%, rgba(10, 15, 50, 0.6) 30%, rgba(10, 15, 50, 0.95) 100%);
            padding: 80px 30px 30px 30px; color: white; text-align: left;
        }
        .modal-h2 { font-size: 32px; font-weight: 800; color: white; margin: 0 0 6px 0; line-height: 1.1; }
        .modal-role { display: inline-block; font-size: 14px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }

        .modal-right { flex: 1; display: flex; flex-direction: column; background: white; }
        .modal-header-right { padding: 24px 30px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .btn-close { background: #f3f4f6; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #555; }
        
        /* Área de scroll con altura fija */
        .scroll-area { 
            flex: 1; 
            overflow-y: auto; 
            padding: 30px;
            height: calc(580px - 80px); /* Altura fija: 580px total - altura del header */
            min-height: 0; /* Importante para scroll en flex */
        }
        
        .horario-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 20px; 
            min-height: 0; /* Importante para evitar crecimiento */
        }

        .time-card { 
            border: 1px solid #e5e7eb; border-radius: 12px; padding: 15px; text-align: center; background: white; 
            border-top: 4px solid #ddd; display: flex; flex-direction: column; gap: 10px;
            min-height: 110px; /* Altura mínima uniforme */
        }
        .time-card.blue { border-top-color: #3b82f6; } 
        .time-card.green { border-top-color: #10b981; } 
        .time-card.purple { border-top-color: #8b5cf6; }
        .t-dia { display: block; font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; margin-bottom: 4px; }
        .t-hora { font-size: 15px; font-weight: 800; color: #333; margin-bottom: 8px; }
        
        /* Botón de WhatsApp */
        .whatsapp-btn {
            background: #25D366;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
            text-decoration: none;
            margin-top: auto; /* Empuja el botón hacia abajo */
        }
        .whatsapp-btn:hover {
            background: #1da851;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }
        .whatsapp-btn i {
            font-size: 14px;
        }

        /* Mensaje cuando no hay horarios */
        .no-horarios {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #9ca3af;
            text-align: center;
            padding: 40px 20px;
        }
        .no-horarios i {
            font-size: 48px;
            margin-bottom: 16px;
            color: #d1d5db;
        }
        .no-horarios h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #6b7280;
        }
        .no-horarios p {
            font-size: 14px;
            max-width: 300px;
        }

        /* =========================================
           RESPONSIVE / MÓVIL (VERSIÓN DEFINITIVA)
           ========================================= */
        @media (max-width: 800px) {
            .main-container { padding: 0 15px; }
            .filter-card { margin-top: -30px; padding: 20px; }
            .controls-grid { grid-template-columns: 1fr; gap: 15px; }
            .filter-header h2 { font-size: 20px; }

            /* -- MODAL MÓVIL CENTRADO -- */
            .modal {
                /* Forzamos el centrado estricto */
                padding: 15px;
                align-items: center;
                justify-content: center;
            }

            .modal-panel {
                flex-direction: column;
                /* Dimensiones fijas también en móvil */
                width: 100%;
                max-width: 380px;
                height: 500px; /* Altura fija en móvil */
                margin: 0 auto;
                border-radius: 24px;
                box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            }

            /* -- FOTO GRANDE -- */
            .modal-left {
                width: 100%;
                height: 180px; /* Altura fija para la foto */
                flex-shrink: 0;
            }
            .profile-overlay {
                padding: 15px;
                justify-content: flex-end;
                background: linear-gradient(to bottom, transparent 0%, rgba(10, 15, 50, 0.5) 40%, rgba(10, 15, 50, 1) 100%);
            }
            .modal-h2 { font-size: 22px; margin-bottom: 4px; }
            .modal-role { font-size: 11px; margin-bottom: 8px; }

            /* -- SCROLL -- */
            .modal-right {
                flex: 1;
                min-height: 0; /* Clave para el overflow */
                display: flex; flex-direction: column;
            }
            .modal-header-right { 
                padding: 12px 15px; 
                flex-shrink: 0;
            }
            .modal-header-right h3 {
                font-size: 16px;
            }
            .modal-header-right span {
                font-size: 12px;
            }
            .scroll-area {
                padding: 15px;
                height: calc(500px - 180px - 56px); /* Altura total - foto - header */
            }

            /* -- GRID 2 COLUMNAS EN MÓVIL -- */
            .horario-grid {
                grid-template-columns: repeat(2, 1fr); /* Siempre 2 columnas */
                gap: 12px;
            }

            .medico-card { height: 380px; }
            .hero-title { font-size: 28px; }
            
            .time-card {
                padding: 12px;
                min-height: 100px;
            }
            
            .whatsapp-btn {
                padding: 8px 10px;
                font-size: 11px;
            }
            
            .no-horarios {
                padding: 20px;
            }
            .no-horarios i {
                font-size: 36px;
            }
            .no-horarios h3 {
                font-size: 16px;
            }
            .no-horarios p {
                font-size: 13px;
            }
        }
        
        /* Para tablets */
        @media (min-width: 801px) and (max-width: 1024px) {
            .modal-panel {
                max-width: 800px;
                height: 550px;
            }
            
            .modal-left {
                width: 350px;
            }
            
            .scroll-area {
                height: calc(550px - 80px);
            }
            
            .horario-grid {
                grid-template-columns: repeat(2, 1fr); /* 2 columnas en tablet */
            }
        }
        
        /* Animación de entrada */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<header class="hero-section">
    <div class="top-bar">
        <div class="brand-logo"><img src="img/logo2.png" alt="Logo"></div>
    </div>
    <div class="hero-content">
        <h1 class="hero-title">Staff Médico Especializado</h1>
        <p class="hero-subtitle">Gestión de horarios y citas médicas.</p>
    </div>
</header>

<div class="main-container">
    <div class="filter-card">
        <div class="filter-header">
            <div class="filter-icon-box"><i class="fa-solid fa-filter"></i></div>
            <h2>Filtrar Especialidad</h2>
        </div>
        <div class="controls-grid">
            <div class="input-wrapper">
                <label>Búsqueda Rápida</label>
                <input id="txtEspecialidad" class="custom-input" placeholder="Ej: CARDIOLOGIA...">
            </div>
            <div class="input-wrapper">
                <label>Lista de Especialidades</label>
                <select id="selectEspecialidad" class="custom-input">
                    <option value="">-- Seleccionar --</option>
                </select>
            </div>
        </div>
    </div>

    <div id="medicosSection" style="display:none;">
        <div style="margin-bottom:20px; display:flex; gap:10px; align-items:center;">
            <h3 style="font-size:24px; font-weight:800; color:#1f2937;">Médicos Disponibles</h3>
            <span id="badgeCount" style="background:#2A3B90; color:white; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:700;">0</span>
        </div>
        <div id="gridMedicos" class="grid-medicos"></div>
    </div>

    <div id="emptyPlaceholder" style="text-align:center; padding:60px; color:#9ca3af;">
        <i class="fa-solid fa-user-doctor" style="font-size:48px; margin-bottom:16px;"></i>
        <p>Selecciona una especialidad para ver resultados.</p>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-panel">
        <div id="modalLeft" class="modal-left">
            <div class="profile-overlay">
                <h2 id="mNombre" class="modal-h2">Nombre Médico</h2>
                <span id="mEspecialidad" class="modal-role">Especialidad</span>
                <div style="color:rgba(255,255,255,0.8); font-size:12px; display:flex; align-items:center;">
                    <i class="fa-solid fa-hospital" style="color:var(--accent); margin-right:5px;"></i> Clínica San Bartolomé
                </div>
            </div>
        </div>
        <div class="modal-right">
            <div class="modal-header-right">
                <div>
                    <h3>Programación</h3>
                    <span style="font-size:13px; color:#888;">Horarios disponibles - Selecciona uno para agendar</span>
                </div>
                <button class="btn-close" onclick="closeModal()"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="scroll-area">
                <div id="gridHorarios" class="horario-grid"></div>
            </div>
        </div>
    </div>
</div>

<script>
   // URLs de API - Usando las mismas que el admin

   /*
   const API_SERVICIOS = 'http://localhost:8082/gcita/servicio/listar';
   const API_MEDICOS = 'http://localhost:8082/gcita/medico/listar';
   const API_PROGRAM = 'http://localhost:8082/gcita/programacionmedicos/listar';
   const API_FOTOS = 'http://localhost:8082/gcita/api/doctor/getFoto';
   */

    /*
   const API_SERVICIOS = 'http://181.224.248.20/gcita/servicio/listar';
   const API_MEDICOS = 'http://181.224.248.20/gcita/medico/listar';
   const API_PROGRAM = 'http://181.224.248.20/gcita/programacionmedicos/listar';
   const API_FOTOS = 'http://181.224.248.20/gcita/api/doctor/getFoto';
   */

    const API_SERVICIOS = '/gcita/servicio/listar';
    const API_MEDICOS = '/gcita/medico/listar';
    const API_PROGRAM = '/gcita/programacionmedicos/listar';
    const API_FOTOS = '/gcita/api/doctor/getFoto';

   // Base URL para las fotos (igual que admin)
   const FOTOS_BASE_URL = 'http://181.224.248.20/appfotos/';
   
   // Número de WhatsApp para agendar citas (cambia este número por el que necesites)
   const WHATSAPP_NUMBER = '51913039208'; 
   const WHATSAPP_MESSAGE_BASE = 'Hola, quisiera agendar una cita médica con la siguiente información:\n\n';

   let servicios = [], medicos = [], programaciones = [];
   let medicosFotos = {}; // Cache para las fotos: {medcod: url}
   
   // Variables para almacenar información del médico actual en el modal
   let currentMedicoInfo = {
       nombre: '',
       especialidad: '',
       codigo: ''
   };

   const selectEsp = document.getElementById('selectEspecialidad');
   const inputEsp = document.getElementById('txtEspecialidad');
   const gridMed = document.getElementById('gridMedicos');
   const medicosSection = document.getElementById('medicosSection');
   const emptyPlaceholder = document.getElementById('emptyPlaceholder');
   const badgeCount = document.getElementById('badgeCount');

   const modal = document.getElementById('modal');
   const modalLeft = document.getElementById('modalLeft');
   const mNombre = document.getElementById('mNombre');
   const mEsp = document.getElementById('mEspecialidad');
   const gridHor = document.getElementById('gridHorarios');

   // Función para formatear el código del médico a 4 dígitos
   function formatMedCod(codigo) {
       return String(codigo).padStart(4, '0');
   }

   // Función para cargar fotos de un médico (igual que admin)
   async function cargarFotoMedico(medcod) {
       try {
           // Si ya tenemos la foto en cache, usarla
           if (medicosFotos[medcod]) {
               return medicosFotos[medcod];
           }
           
           // Obtener las fotos del médico desde tu API
           const response = await fetch(`${API_FOTOS}/${medcod}`);
           if (!response.ok) {
               if (response.status === 204) {
                   console.log(`No hay fotos para el médico ${medcod}`);
               }
               return null;
           }
           
           const fotos = await response.json();
           
           if (fotos && fotos.length > 0) {
               // Buscar la primera foto con URL válida
               const foto = fotos[0];
               let fotoUrl = null;
               
               if (foto.urlFoto) {
                   // Construir la URL completa
                   fotoUrl = FOTOS_BASE_URL + foto.urlFoto;
               } else if (foto.url) {
                   // Si ya viene la URL completa
                   fotoUrl = foto.url;
               }
               
               if (fotoUrl) {
                   // Verificar que la imagen existe
                   const imgExists = await verificarImagen(fotoUrl);
                   if (imgExists) {
                       medicosFotos[medcod] = fotoUrl;
                       return fotoUrl;
                   }
               }
           }
           return null;
       } catch (error) {
           console.error(`Error cargando foto para ${medcod}:`, error);
           return null;
       }
   }

   // Función para verificar si una imagen existe
   function verificarImagen(url) {
       return new Promise((resolve) => {
           const img = new Image();
           img.onload = () => resolve(true);
           img.onerror = () => resolve(false);
           img.src = url;
       });
   }

   // Cargar también foto para el modal
   async function cargarFotoParaModal(medcod) {
       try {
           const fotoUrl = await cargarFotoMedico(medcod);
           return fotoUrl;
       } catch (error) {
           console.error('Error cargando foto para modal:', error);
           return null;
       }
   }

   // Función para crear mensaje de WhatsApp
   function crearMensajeWhatsApp(nombreMedico, especialidad, fecha, hora) {
       // Formatear la fecha para que sea más legible
       const fechaFormateada = new Date(fecha).toLocaleDateString('es-PE', {
           weekday: 'long',
           year: 'numeric',
           month: 'long',
           day: 'numeric'
       });
       
       const mensaje = `${WHATSAPP_MESSAGE_BASE}` +
                      `👨‍⚕️ *Médico:* ${nombreMedico}\n` +
                      `🎯 *Especialidad:* ${especialidad}\n` +
                      `📅 *Fecha:* ${fechaFormateada}\n` +
                      `⏰ *Horario:* ${hora}\n\n` +
                      `Por favor, confírmame si este horario está disponible.`;
       
       // Codificar el mensaje para URL
       return encodeURIComponent(mensaje);
   }

   // Función para abrir WhatsApp
   function abrirWhatsApp(nombreMedico, especialidad, fecha, hora) {
       const mensaje = crearMensajeWhatsApp(nombreMedico, especialidad, fecha, hora);
       const urlWhatsApp = `https://wa.me/${WHATSAPP_NUMBER}?text=${mensaje}`;
       
       // Abrir en nueva pestaña
       window.open(urlWhatsApp, '_blank');
       
       // Cerrar el modal después de abrir WhatsApp
       setTimeout(() => {
           closeModal();
       }, 500);
   }

   document.addEventListener('DOMContentLoaded', init);

   async function init(){
       try {
           const [s, m, p] = await Promise.all([
               fetch(API_SERVICIOS).then(r=>r.json()),
               fetch(API_MEDICOS).then(r=>r.json()),
               fetch(API_PROGRAM).then(r=>r.json())
           ]);
           servicios = s; medicos = m; programaciones = p;
           fillSelect(servicios);

           const def = servicios.find(x => x.descripcion.toUpperCase().includes('MEDICINA GENERAL'));
           if(def){ 
               selectEsp.value = def.codigo; 
               await showDoctors(def.codigo); 
           }

           inputEsp.addEventListener('input', e => filterServices(e.target.value));
           selectEsp.addEventListener('change', async (e) => {
               await showDoctors(e.target.value);
           });
       } catch(e){ 
           console.error('Error en init:', e); 
       }
   }

   function fillSelect(list){
       selectEsp.innerHTML = '<option value="">-- Seleccionar --</option>';
       list.forEach(i => {
           const o = document.createElement('option');
           o.value = i.codigo; o.textContent = i.descripcion;
           selectEsp.appendChild(o);
       });
   }

   function filterServices(txt){
       txt = txt.toUpperCase();
       if(!txt){ fillSelect(servicios); return; }
       const f = servicios.filter(x => x.descripcion.toUpperCase().includes(txt));
       fillSelect(f);
       if(f.length===1){ 
           selectEsp.value = f[0].codigo; 
           showDoctors(f[0].codigo); 
       }
   }

   // Función para mostrar médicos (actualizada para cargar fotos)
   async function showDoctors(cod){
       if(!cod){ 
           medicosSection.style.display='none'; 
           emptyPlaceholder.style.display='block'; 
           return; 
       }
       
       const docs = medicos.filter(x => String(x.codigoServicio) === String(cod));
       gridMed.innerHTML=''; 
       badgeCount.textContent = docs.length;

       if(docs.length===0){
           medicosSection.style.display='none'; 
           emptyPlaceholder.style.display='block';
           emptyPlaceholder.innerHTML = '<p>No hay médicos en esta especialidad.</p>'; 
           return;
       }
       
       medicosSection.style.display='block'; 
       emptyPlaceholder.style.display='none';

       // Cargar fotos para todos los médicos
       for (const d of docs) {
           const div = document.createElement('div');
           div.className = 'medico-card';
           
           // Formatear el código del médico para que tenga 4 dígitos
           const medcod = formatMedCod(d.codigo);
           
           // Intentar cargar la foto del médico
           let fotoUrl = await cargarFotoMedico(medcod);
           
           // Si no hay foto, usar una por defecto (igual que admin)
           if (!fotoUrl) {
               fotoUrl = 'https://images.unsplash.com/photo-1612349317150-e413f6a5b16d?q=90&w=800&auto=format&fit=crop';
           }
           
           div.style.backgroundImage = `url('${fotoUrl}')`;

           div.innerHTML = `
               <div class="card-overlay">
                   <div class="card-name">${d.descripcion}</div>
                   <div class="card-spec">${getServiceName(d.codigoServicio)}</div>
                   <button class="card-btn">
                       <i class="fa-regular fa-calendar-check"></i> Ver Horarios
                   </button>
               </div>
           `;
           
           // Guardar el medcod en el elemento para usarlo en el modal
           div.dataset.medcod = medcod;
           div.onclick = async () => {
               // Cargar la foto para el modal también
               const fotoModal = await cargarFotoParaModal(medcod);
               openModal(d.codigo, esc(d.descripcion), d.codigoServicio, fotoModal);
           };
           
           gridMed.appendChild(div);
       }
   }

   async function openModal(cod, nombre, codServ, fotoUrl){
       // Guardar información del médico actual
       currentMedicoInfo = {
           nombre: unesc(nombre),
           especialidad: getServiceName(codServ),
           codigo: cod
       };
       
       mNombre.textContent = currentMedicoInfo.nombre;
       mEsp.textContent = currentMedicoInfo.especialidad;
       
       // Si no hay fotoUrl específica, intentar cargarla
       if (!fotoUrl) {
           const medcod = formatMedCod(cod);
           fotoUrl = await cargarFotoParaModal(medcod);
       }
       
       // Usar la foto del médico o una por defecto
       const bgUrl = fotoUrl || 'https://images.unsplash.com/photo-1559839734-2b71ea197ec2?q=80&w=800&auto=format&fit=crop';
       modalLeft.style.backgroundImage = `url('${bgUrl}')`;

       const hors = programaciones.filter(p => String(p.codigoMedico) === String(cod))
                                  .sort((a,b)=> new Date(a.fecha)-new Date(b.fecha));

       gridHor.innerHTML = '';
       if(hors.length===0){
           // Mostrar mensaje cuando no hay horarios
           gridHor.innerHTML = `
               <div class="no-horarios" style="grid-column: 1 / -1;">
                   <i class="fa-regular fa-calendar-xmark"></i>
                   <h3>Sin horarios disponibles</h3>
                   <p>Este médico no tiene horarios disponibles por el momento. Intenta más tarde.</p>
               </div>
           `;
       } else {
           const cols = ['blue','green','purple'];
           hors.forEach((h,i) => {
               const f = new Date(h.fecha);
               const dia = f.toLocaleDateString('es-PE', {weekday:'short', day:'numeric', month:'short'}).replace('.','');
               const hora = (h.hora_inicio) ? `${h.hora_inicio.substr(0,5)} - ${h.hora_fin.substr(0,5)}` : (h.hora || 'Turno');
               
               const el = document.createElement('div');
               el.className = `time-card ${cols[i%3]}`;
               
               // Crear botón de WhatsApp
               const whatsappBtn = document.createElement('a');
               whatsappBtn.className = 'whatsapp-btn';
               whatsappBtn.innerHTML = '<i class="fa-brands fa-whatsapp"></i> Agendar';
               
               // Asignar evento al botón de WhatsApp
               whatsappBtn.onclick = (e) => {
                   e.stopPropagation(); // Prevenir cualquier otro evento
                   abrirWhatsApp(
                       currentMedicoInfo.nombre,
                       currentMedicoInfo.especialidad,
                       h.fecha,
                       hora
                   );
               };
               
               el.innerHTML = `
                   <span class="t-dia">${dia}</span>
                   <div class="t-hora">${hora}</div>
               `;
               
               el.appendChild(whatsappBtn);
               gridHor.appendChild(el);
           });
       }
       
       modal.classList.add('open');
       document.body.style.overflow = 'hidden';
   }

   function closeModal(){ 
       modal.classList.remove('open'); 
       document.body.style.overflow=''; 
   }
   
   function getServiceName(c){ 
       const s = servicios.find(x=>String(x.codigo)===String(c)); 
       return s ? s.descripcion : 'General'; 
   }
   
   function esc(s){ 
       return String(s).replace(/'/g, "\\'"); 
   }
   
   function unesc(s){ 
       return s; 
   }
   
   modal.addEventListener('click', e => { 
       if(e.target===modal) closeModal(); 
   });

</script>
</body>
</html>
